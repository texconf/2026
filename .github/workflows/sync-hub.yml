name: Sync hub preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - talks/**
      - program.yaml
      - build.ts
      - index.src.html

jobs:
  sync:
    if: ${{ secrets.TEXCONF_REPO_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: texconf/texconf.github.io
          path: texconf.github.io
          token: ${{ secrets.TEXCONF_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build:hub

      - name: Commit hub preview if changed
        working-directory: texconf.github.io
        env:
          HUB_TOKEN: ${{ secrets.TEXCONF_REPO_TOKEN }}
        run: |
          if git diff --quiet index.html; then
            echo "No hub preview changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update talk preview from texconf/2026"
          git push "https://x-access-token:${HUB_TOKEN}@github.com/texconf/texconf.github.io.git" HEAD:main
